name: Quality gate and deploy

# Runs the quality gate on every pull request and push. Vercel deploys from its
# GitHub integration; to stop a failing commit reaching production, turn on
# Deployment Checks in Vercel (Settings, Deployment Checks) and require this job.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: No en or em dashes
        run: pnpm check:dashes
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Prettier
        run: pnpm format:check
      - name: Production dependency audit
        run: pnpm audit --prod
      - name: Build
        run: pnpm build
      - name: Site validator (markup, schema, links, meta, headers, placeholders)
        run: pnpm validate

      - name: Lighthouse budget (applied throttling, enforced)
        run: scripts/lighthouse.sh applied
      - name: Lighthouse estimate (simulated throttling, reported)
        if: always()
        continue-on-error: true
        run: scripts/lighthouse.sh simulated
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          retention-days: 30
